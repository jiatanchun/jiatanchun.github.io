<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} home">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="3" stroke="currentColor" stroke-width="2.2"/>
        <rect x="12" y="12" width="18" height="18" rx="2.5" stroke="currentColor" stroke-width="2.2" opacity="0.7"/>
        <rect x="19" y="19" width="11" height="11" rx="2" fill="var(--accent)"/>
      </svg>
      {{ site.Title }}
    </a>
    <ul>
      <li><a href="{{ "/#practices" | relURL }}">Practices</a></li>
      <li><a href="{{ "/#approach" | relURL }}">Approach</a></li>
      <li><a href="{{ "/#offices" | relURL }}">Offices</a></li>
      <li><a href="{{ "/contact/" | relURL }}"{{ if eq .RelPermalink "/contact/" }} aria-current="page"{{ end }}>Contact</a></li>
    </ul>
  </div>
</header>
